<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Winter AR World</title>
    <meta name="description" content="Hello, AR World! • A-Frame">
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <!-- script src="https://aframe.io/aframe/dist/aframe-master.min.js"></script -->
    <script>
      AFRAME.registerComponent('follow-shadow', {
        schema: {type: 'selector'},
        init() {this.el.object3D.renderOrder = -1;},
        tick() {
          if (this.data) {
            this.el.object3D.position.copy(this.data.object3D.position);
            this.el.object3D.position.y-=0.001; // stop z-fighting
          }
        }
      });

      AFRAME.registerComponent('ar-spawner', {
        init: function () {
          // Listen for the select event (screen tap) specifically in AR
          this.el.sceneEl.addEventListener('enter-vr', () => {
            if (this.el.sceneEl.is('ar-mode')) {
              this.el.sceneEl.xrSession.addEventListener('select', (ev) => {
                this.spawnEntity();
              });
            }
          });

          // Also allow clicking on desktop for testing
          window.addEventListener('click', () => {
            if (!this.el.sceneEl.is('ar-mode')) {
              this.spawnEntity();
            }
          });
        },

        spawnEntity: function () {
          const newEntity = document.createElement('a-entity');
          
          // Try to use your snowman model
          newEntity.setAttribute('gltf-model', '#snowman-model');
          
          // Get the position of the reticle (#objects)
          const reticle = document.querySelector('#objects');
          const position = reticle.getAttribute('position');
          
          // Set position and a visible scale
          newEntity.setAttribute('position', position);
          newEntity.setAttribute('scale', '0.004 0.004 0.004'); // Match your tree scale
          
          // Add to the scene
          this.el.sceneEl.appendChild(newEntity);
          
          // FALLBACK: If snowman is missing, also spawn a small white sphere
          const ball = document.createElement('a-sphere');
          ball.setAttribute('position', position);
          ball.setAttribute('radius', '0.05');
          ball.setAttribute('color', 'white');
          this.el.sceneEl.appendChild(ball);
        }
      });
    </script>
  </head>
  <body>
    <a-scene
      spawner
      reflection="directionalLight: a-light[type=directional]"
      ar-hit-test="target: #objects;"
      renderer="colorManagement: true; exposure: 1; toneMapping: ACESFilmic"
      shadow="type: pcfsoft"
      xr-mode-ui="XRMode: xr"
    >

      <a-assets>
        <a-asset-item id="tree-model" src="pine_tree.glb"></a-asset-item>
        <a-asset-item id="snowman-model" src="pbr_snowman.glb"></a-asset-item>
      </a-assets>

      <a-entity id="objects" position="0 0 -3">
        
        <a-entity gltf-model="#tree-model" position="0.4 0 0" scale="0.004 0.004 0.004"></a-entity>
        <a-entity gltf-model="#snowman-model" position="-0.4 0 0" scale="0.2 0.2 0.2"></a-entity>
      </a-entity>

      <a-light type="directional" position="1 1 1" intensity="1.57" shadow-camera-automatic="#objects"></a-light>
      <a-camera position="0 0.4 0" wasd-controls="acceleration:10;">
        <a-cursor fuse="false" raycaster="objects: .none"></a-cursor>
      </a-camera>
      
      <a-plane follow-shadow="#objects" material="shader:shadow" shadow="cast:false;" rotation="-90 0 0" width="2" height="2"></a-plane>
      <a-sky color="#ECECEC" hide-on-enter-ar></a-sky>
    </a-scene>
  </body>
</html>
